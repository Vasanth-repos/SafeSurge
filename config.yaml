simulation:
  timestep_seconds: 60
  forecast_minutes: 180

surface:
  routing_coefficient: 0.0008
  max_routing_fraction: 0.35

hydrology:
  default_cn: 85

drainage:
  default_capacity_m3_s: 0.01

sensor:
  heartbeat_timeout_seconds: 180
  bias_alpha: 0.3
  agreement_window_steps: 10

risk:
  threshold_profile:
    id: "prototype_v1"
    type: "PROTOTYPE"
    unit: "cm"
    description: >
      Prototype depth classifications for
      hackathon visualization. These are not
      universal flood-safety standards.
    thresholds:
      watch: 5.0
      high: 15.0
      unsafe: 25.0

fusion:
  bias_alpha: 0.3
  minimum_bias_observations: 3
  max_residual_for_bias_update_cm: 20.0
  max_bias_cm: 50.0
  max_observation_time_difference_seconds: 30
  minimum_model_depth_for_spatial_correction_cm: 1.0
  spatial_correction:
    power: 2.0
    max_distance_m: 1000.0
    max_absolute_correction_cm: 15.0
    minimum_weight_sum: 0.000001
  confidence:
    weights:
      coverage: 0.30
      freshness: 0.30
      agreement: 0.40
simulation:
  timestep_seconds: 60
  forecast_minutes: 180

anomaly:
  rapid_rise:
    threshold_cm_per_minute: 5.0
  model_disagreement:
    threshold_cm: 20.0
  sensor_inconsistency:
    ultrasonic_water_threshold_cm: 2.0
    max_time_difference_seconds: 10
  capacity_anomaly:
    minimum_depth_cm: 10.0
    minimum_rise_rate_cm_per_minute: 2.0
    expected_capacity_factor: 1.0
    capture_efficiency_drop: 0.40

roads:
  minimum_exposure_fraction: 0.10

routing:
  risk_penalty:
    SAFE: 0.0
    WATCH: 120.0
    HIGH: 600.0
  uncertainty_weight: 120.0
  unsafe_edges_blocked: true


