# Urban Flood Nowcasting & Response System — Default Configuration
timestep_s: 60                 # Timestep Delta t in seconds
max_routing_fraction: 0.5      # f_max: Cap on fraction of storage leaving cell per timestep
routing_coeff: 0.1             # k: Surface roughness / transport coefficient
bias_smoothing_alpha: 0.3      # alpha: Exponential weight on new error for bias correction

confidence_weights:
  coverage: 0.4                # w_c
  freshness: 0.3               # w_f
  agreement: 0.3               # w_a

agreement_window_size: 10      # N timesteps for rolling error window (~10 min at dt=60s)
sensor_critical_rate_cm_min: 5.0 # r_critical: Reject/flag readings with rise rate above this
sensor_stale_missed_hb: 3      # Number of missed heartbeats to transition to STALE
sensor_offline_missed_hb: 6    # Number of missed heartbeats to transition to OFFLINE
max_physical_depth_cm: 300.0   # Plausible max physical flood depth in catchment

capacity_factor_levels:
  normal: 1.00
  minor: 0.80
  partial: 0.60
  severe: 0.30

grid:
  cell_size_m: 10.0            # 10m x 10m per grid cell (area = 100 m^2)
  rows: 20
  cols: 20
  tolerance_m3: 0.05           # Mass conservation error tolerance threshold

routing_penalties:
  lambda_risk: 10.0            # Penalty weight for road flood risk
  mu_uncertainty: 5.0          # Penalty weight for model uncertainty
